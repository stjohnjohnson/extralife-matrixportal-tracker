[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E203", # whitespace before ':' (black compatible)
]

[tool.ruff.lint.isort]
known-first-party = ["lib_display", "tools"]
